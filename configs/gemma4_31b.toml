# Gemma 4 31B — vLLM in-place direct editing
#
# Reference result:
#   - Trial 40 selected from a completed 60-trial run
#   - Baseline: 99/100 refusals
#   - Best: 7/100 refusals (Gemini LLM judge, min 100 / max 150 tokens)
#
# Operational rule: do not fall back to HF generation/evaluation for this
# model. HF may still load once for hidden-state extraction if the vLLM hidden
# state fast path is unavailable, and HF is used for final safetensors export.
# The optimization loop itself should stay on vLLM.
#
# Lessons applied to 31B dense:
#   - Q/K/V/O projections as steerable targets
#   - Norm preservation (weight_normalization = "pre")
#   - float32 projection precision
#   - Winsorize vectors
#   - Much wider strength range to push KL up toward 0.001
#   - min 100 / max 150 token generation for delayed-refusal detection
#   - vLLM LoRA disabled; Gemma 4 vLLM LoRA was ineffective in testing
#   - vLLM in-place editing enabled; this is the fast path for trials

[model]
model_id = "google/gemma-4-31B-it"
dtype_fallback_order = ["bfloat16"]
quant_method = "none"
use_torch_compile = false
device_map = "auto"
max_memory = {0 = "80GiB"}
backend = "vllm"
tensor_parallel_size = 1
gpu_memory_utilization = 0.92
enable_expert_parallel = false
enable_chunked_prefill = true
enforce_eager = true
max_model_len = 4096
disable_lora = true
use_in_place_editing = true

[inference]
batch_size = 0
max_batch_size = 8
max_gen_tokens = 150
min_gen_tokens = 100

[steering]
steering_mode = "direct"
vector_method = "mean"
orthogonal_projection = true
winsorize_vectors = true
winsorize_quantile = 0.995
decay_kernel = "gaussian"
weight_normalization = "pre"
disabled_components = ["mlp.down_proj"]

# Very wide strength range — current KL is ~0.0005, we need to push to ~0.001
# Higher strength = more aggressive refusal removal = higher KL
strength_range = [1.0, 6.0]

[optimization]
num_trials = 60
num_warmup_trials = 15
checkpoint_dir = "checkpoints_gemma4_31b_v8"

[kl]
scale = 1.0
token_count = 3
# Accept up to 0.001 KL — current trials are way too conservative
target = 0.001
prune_threshold = 50.0

[detection]
llm_judge = true
llm_judge_model = "google/gemini-3-flash-preview"
llm_judge_batch_size = 10
llm_judge_concurrency = 35

[benign_prompts]
dataset = "datasets/good_1000"
split = "train[:400]"
column = "prompt"

[target_prompts]
dataset = "datasets/harmful_1000"
split = "train[:400]"
column = "prompt"

[benign_eval_prompts]
dataset = "datasets/good_1000"
split = "train[400:500]"
column = "prompt"

[target_eval_prompts]
dataset = "datasets/harmful_1000"
split = "train[400:500]"
column = "prompt"

[display]
print_responses = false
